name: Install WorkFlow Planner from ZIP
on:
  push:
    branches: [main]
    paths:
      - WorkFlow-Planner-V1.1.1-Vercel-Simple-Setup.zip
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9e4a83 # v4.2.2
        with:
          persist-credentials: true
      - name: Verify and unpack approved application ZIP
        shell: bash
        run: |
          set -euo pipefail
          echo "30c6f6972de8455517a1a610ed037367c9322c307f0c5c5f8a51d3997e48b265  WorkFlow-Planner-V1.1.1-Vercel-Simple-Setup.zip" | sha256sum -c -
          python3 - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          import shutil
          root = Path.cwd().resolve()
          with ZipFile('WorkFlow-Planner-V1.1.1-Vercel-Simple-Setup.zip') as z:
              for item in z.infolist():
                  path = (root / item.filename).resolve()
                  if path != root and root not in path.parents:
                      raise ValueError('Unsafe archive path: ' + item.filename)
                  if item.is_dir():
                      path.mkdir(parents=True, exist_ok=True)
                  else:
                      path.parent.mkdir(parents=True, exist_ok=True)
                      with z.open(item) as source, path.open('wb') as target:
                          shutil.copyfileobj(source, target)
          print('Application source extracted successfully.')
          PY
      - name: Commit extracted application files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "feat: install WorkFlow Planner V1.1.1 from verified package"
            git push
          fi
