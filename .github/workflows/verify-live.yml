name: Verify Live Vercel Site
on:
  push:
    branches: [main]
    paths:
      - 'scripts/build.mjs'
      - 'public/**'
      - 'supabase.public.json'
      - '.github/workflows/verify-live.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout for expected public configuration
        uses: actions/checkout@v4.2.2
      - name: Verify production frontend and username Edge Function
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://arfteamplanner.vercel.app"
          PROJECT="ovfygxeqgpjezdhbidmo"
          echo '## WorkFlow Planner Live Verification' >> "$GITHUB_STEP_SUMMARY"
          echo 'Waiting for Production deployment to match latest source...' 
          for attempt in $(seq 1 16); do
            STATUS=$(curl --location --silent --show-error --connect-timeout 8 --max-time 25 --output /tmp/config.js --write-out '%{http_code}' "$BASE/config.js" || true)
            if [ "$STATUS" = "200" ] && grep -q "$PROJECT" /tmp/config.js; then
              echo "Production frontend points to the correct Supabase project"
              break
            fi
            if [ "$attempt" -eq 16 ]; then
              echo "ERROR: Production is not connected to expected Supabase project after 16 attempts."
              echo '**Result:** Vercel build is still using Demo Mode or an incorrect project.' >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            sleep 8
          done
          INDEX_STATUS=$(curl --location --silent --show-error --connect-timeout 8 --max-time 25 --output /tmp/home.html --write-out '%{http_code}' "$BASE/")
          [ "$INDEX_STATUS" = "200" ] && grep -q 'WorkFlow Planner' /tmp/home.html
          echo '✅ Homepage responds HTTP 200' >> "$GITHUB_STEP_SUMMARY"
          echo '✅ Frontend connects to the correct Supabase project' >> "$GITHUB_STEP_SUMMARY"
          # Verify the actual V1.2 files, not just the old demo or Supabase configuration.
          for i in $(seq 1 16); do
            APP_STATUS=$(curl -L -sS --connect-timeout 8 --max-time 20 -o /tmp/arf-app.js -w '%{http_code}' "$BASE/app.js" || true)
            if [ "$APP_STATUS" = "200" ] && grep -q 'taskDetailContent' /tmp/arf-app.js && grep -q 'taskActiveOnDate' /tmp/arf-app.js && grep -q 'download-report' /tmp/arf-app.js; then
              break
            fi
            if [ "$i" -eq 16 ]; then
              echo 'V1.2 app JavaScript was not found on production.'
              exit 1
            fi
            sleep 8
          done
          for resource in discussion.js reports.js; do
            STATUS=$(curl -L -sS --connect-timeout 8 --max-time 20 -o /tmp/$resource -w '%{http_code}' "$BASE/$resource")
            echo "$resource returned HTTP $STATUS"
            [ "$STATUS" = "200" ]
          done
          echo '✅ V1.2 calendar, collaboration and report modules are live' >> "$GITHUB_STEP_SUMMARY"
          # V1.3 regression: verify deployed management controls and ordering logic.
          grep -q "case 'delete-project'" /tmp/arf-app.js
          grep -q "case 'delete-category'" /tmp/arf-app.js
          grep -q "case 'edit-member'" /tmp/arf-app.js
          grep -q 'draggingWorkloadId' /tmp/arf-app.js
          STORE_STATUS=$(curl --location --silent --show-error --connect-timeout 8 --max-time 25 --output /tmp/arf-store.js --write-out '%{http_code}' "$BASE/store.js")
          [ "$STORE_STATUS" = "200" ]
          grep -q 'workload_positions' /tmp/arf-store.js
          grep -q 'updateMemberDetails' /tmp/arf-store.js
          echo '✅ V1.3 delete, member editing and persisted workload controls live' >> "$GITHUB_STEP_SUMMARY"
          # V1.3.1 attachment editor must actually be deployed (not only committed).
          for attempt in $(seq 1 20); do
            curl -L -sS --connect-timeout 8 --max-time 20 -o /tmp/arf-app.js "$BASE/app.js"
            curl -L -sS --connect-timeout 8 --max-time 20 -o /tmp/arf-store.js "$BASE/store.js"
            curl -L -sS --connect-timeout 8 --max-time 20 -o /tmp/arf-core.js "$BASE/core.js"
            if grep -q "case 'add-attachment'" /tmp/arf-app.js \
              && grep -q "case 'remove-attachment'" /tmp/arf-app.js \
              && grep -q 'normalizeAttachmentUrls' /tmp/arf-core.js \
              && grep -q 'attachment_urls' /tmp/arf-store.js; then
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              echo 'New attachment editor not found in production app assets'
              exit 1
            fi
            sleep 7
          done
          echo '✅ Multiple HTTPS attachment Add/Remove controls are live on Vercel' >> "$GITHUB_STEP_SUMMARY"
          KEY=$(node -p "require('./supabase.public.json').supabaseAnonKey")
          EDGE="https://$PROJECT.supabase.co/functions/v1/username-login"
          # Empty payload must return a validation error; never use or print actual user credentials.
          EDGE_STATUS=$(curl --silent --show-error --connect-timeout 8 --max-time 20 -o /tmp/edge.json -w '%{http_code}' -X POST "$EDGE" -H "apikey: $KEY" -H 'Content-Type: application/json' -d '{}' )
          echo "Edge Function validation returned HTTP $EDGE_STATUS"
          [ "$EDGE_STATUS" = "400" ]
          echo '✅ Username Edge Function responds to invalid input' >> "$GITHUB_STEP_SUMMARY"
          EDGE_AUTH=$(curl --silent --show-error --connect-timeout 8 --max-time 20 -o /tmp/auth.json -w '%{http_code}' -X POST "$EDGE" -H "apikey: $KEY" -H 'Content-Type: application/json' -d '{"username":"notarealuser99","password":"InvalidTestPassword"}')
          echo "Edge Function invalid-credentials check returned HTTP $EDGE_AUTH"
          [ "$EDGE_AUTH" = "401" ]
          echo '✅ Username Edge Function checks credentials without exposing user details' >> "$GITHUB_STEP_SUMMARY"
