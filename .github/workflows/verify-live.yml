name: Verify Live Vercel Site
on:
  push:
    branches: [main]
    paths:
      - 'scripts/build.mjs'
      - 'public/**'
      - 'supabase.public.json'
      - '.github/workflows/verify-live.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout for expected public configuration
        uses: actions/checkout@v4.2.2
      - name: Verify production frontend and username Edge Function
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://arfteamplanner.vercel.app"
          PROJECT="ovfygxeqgpjezdhbidmo"
          echo '## WorkFlow Planner Live Verification' >> "$GITHUB_STEP_SUMMARY"
          echo 'Waiting for Production deployment to match latest source...' 
          for attempt in $(seq 1 16); do
            STATUS=$(curl --location --silent --show-error --connect-timeout 8 --max-time 25 --output /tmp/config.js --write-out '%{http_code}' "$BASE/config.js" || true)
            if [ "$STATUS" = "200" ] && grep -q "$PROJECT" /tmp/config.js; then
              echo "Production frontend points to the correct Supabase project"
              break
            fi
            if [ "$attempt" -eq 16 ]; then
              echo "ERROR: Production is not connected to expected Supabase project after 16 attempts."
              echo '**Result:** Vercel build is still using Demo Mode or an incorrect project.' >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            sleep 8
          done
          INDEX_STATUS=$(curl --location --silent --show-error --connect-timeout 8 --max-time 25 --output /tmp/home.html --write-out '%{http_code}' "$BASE/")
          [ "$INDEX_STATUS" = "200" ] && grep -q 'WorkFlow Planner' /tmp/home.html
          echo '✅ Homepage responds HTTP 200' >> "$GITHUB_STEP_SUMMARY"
          echo '✅ Frontend connects to the correct Supabase project' >> "$GITHUB_STEP_SUMMARY"
          KEY=$(node -p "require('./supabase.public.json').supabaseAnonKey")
          EDGE="https://$PROJECT.supabase.co/functions/v1/username-login"
          # Empty payload must return a validation error; never use or print actual user credentials.
          EDGE_STATUS=$(curl --silent --show-error --connect-timeout 8 --max-time 20 -o /tmp/edge.json -w '%{http_code}' -X POST "$EDGE" -H "apikey: $KEY" -H 'Content-Type: application/json' -d '{}' )
          echo "Edge Function validation returned HTTP $EDGE_STATUS"
          [ "$EDGE_STATUS" = "400" ]
          echo '✅ Username Edge Function responds to invalid input' >> "$GITHUB_STEP_SUMMARY"
          EDGE_AUTH=$(curl --silent --show-error --connect-timeout 8 --max-time 20 -o /tmp/auth.json -w '%{http_code}' -X POST "$EDGE" -H "apikey: $KEY" -H 'Content-Type: application/json' -d '{"username":"notarealuser99","password":"InvalidTestPassword"}')
          echo "Edge Function invalid-credentials check returned HTTP $EDGE_AUTH"
          [ "$EDGE_AUTH" = "401" ]
          echo '✅ Username Edge Function checks credentials without exposing user details' >> "$GITHUB_STEP_SUMMARY"
